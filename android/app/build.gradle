apply plugin: 'com.android.application'

// Release signing: reads android/key.properties (gitignored -- see android/.gitignore's
// key.properties/*.jks entries) for the keystore path/passwords, generated once via
// `keytool -genkeypair` and never committed. Guarded on the properties file existing so
// a fresh clone without it still builds (assembleRelease then falls back to an unsigned
// APK instead of failing outright) -- only the machine holding the real release keystore
// can produce an installable, upgrade-compatible signed release build.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// App version: package.json at the repo root is the single source of truth (vite.config.ts
// reads the same field for the web build). versionCode is derived as
// major*10000 + minor*100 + patch, so it rises monotonically with every SemVer bump --
// Play rejects an upload whose versionCode isn't higher than the last one. Pre-release
// suffixes aren't supported, and minor/patch must stay <= 99 or codes would collide.
def appVersionName = new groovy.json.JsonSlurper().parse(rootProject.file("../package.json")).version
def appVersionMatch = appVersionName =~ /^(\d+)\.(\d+)\.(\d+)$/
if (!appVersionMatch.matches()) {
    throw new GradleException("package.json version \"${appVersionName}\" must be plain MAJOR.MINOR.PATCH")
}
def (appMajor, appMinor, appPatch) = (1..3).collect { appVersionMatch.group(it) as int }
if (appMinor > 99 || appPatch > 99) {
    throw new GradleException("package.json version ${appVersionName}: minor and patch must be <= 99 to derive versionCode")
}
def appVersionCode = appMajor * 10000 + appMinor * 100 + appPatch

android {
    namespace = "com.formulist.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.formulist.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile file("$projectDir/${keystoreProperties['storeFile']}")
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
